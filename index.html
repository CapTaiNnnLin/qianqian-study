<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="千千学习台">
<meta name="theme-color" content="#FFFBE6">
<meta name="description" content="八年级学生学习管理工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>千千的学习工作台</title>
<style>
:root{
  --bg-main:#FFFBE6; --bg-card:#FFFFFF; --bg-sidebar:#FFF5D6; --bg-soft:#FFF8E7;
  --primary:#FFD93D; --primary-dark:#FFC107; --primary-light:#FFF3CC;
  --accent:#FFAB91; --accent-light:#FFE0B2;
  --text-main:#5D4E37; --text-2:#8B7E66; --text-3:#C4B999;
  --green:#81C784; --green-bg:#E8F5E9;
  --orange:#FFB74D; --orange-bg:#FFF3E0;
  --red:#E57373; --red-bg:#FFEBEE;
  --blue:#64B5F6; --blue-bg:#E3F2FD;
  --purple:#BA68C8; --purple-bg:#F3E5F5;
  --border:#FFE9A8;
  --shadow:0 2px 12px rgba(255,193,7,.08);
  --shadow-hover:0 4px 20px rgba(255,193,7,.15);
  --r:16px; --r-sm:10px; --r-lg:24px;
  --sidebar-w:220px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg-main); color:var(--text-main);
  font-size:14px; line-height:1.6; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 15% 85%,rgba(255,217,61,.06) 0%,transparent 35%),
    radial-gradient(circle at 85% 15%,rgba(255,171,145,.05) 0%,transparent 35%);
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:3px}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w);
  background:var(--bg-sidebar); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:100; transition:width .3s;
}
.sidebar-logo{padding:14px 8px 10px; text-align:center; border-bottom:1px solid var(--border)}
.sidebar-logo img{width:48px; height:auto}
.sidebar-logo .logo-text{font-size:12px; font-weight:700; color:var(--text-main); margin-top:2px}
.nav-items{flex:1; padding:8px; overflow-y:auto}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:4px;
  border-radius:var(--r-sm); cursor:pointer; transition:all .2s; color:var(--text-2);
  user-select:none;
}
.nav-item:hover{background:rgba(255,217,61,.15)}
.nav-item.active{background:var(--primary); color:#5D4E37; font-weight:600}
.nav-item .nav-icon{flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center}
.nav-item .nav-icon img{width:26px; height:26px; object-fit:contain}
.nav-item .nav-text{font-size:13px; white-space:nowrap}
.sidebar-footer{padding:10px; border-top:1px solid var(--border)}
.sidebar-footer .nav-item{font-size:12px}

/* ===== MAIN ===== */
.main{margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; transition:margin-left .3s}
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,251,230,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:10px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.topbar-left{display:flex; align-items:center; gap:14px}
.topbar-date{font-size:15px; font-weight:700}
.topbar-date .weekday{color:var(--text-2); font-weight:500; font-size:13px}
.topbar-greeting{font-size:12px; color:var(--text-2)}
.topbar-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.topbar-progress{display:flex; align-items:center; gap:8px}
.topbar-progress .label{font-size:12px; color:var(--text-2); white-space:nowrap}
.progress-bar{width:90px; height:8px; background:var(--primary-light); border-radius:4px; overflow:hidden}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-dark)); border-radius:4px; transition:width .4s}
.topbar-points{
  display:flex; align-items:center; gap:4px;
  background:var(--primary-light); padding:4px 12px; border-radius:20px;
  font-weight:700; color:var(--primary-dark); font-size:14px; white-space:nowrap;
}
.topbar-points .star{font-size:13px}
.topbar-streak{
  display:flex; align-items:center; gap:4px; font-size:12px; color:var(--orange); font-weight:600; white-space:nowrap;
}

.content{flex:1; padding:20px; max-width:960px; margin:0 auto; width:100%}

/* ===== GENERIC ===== */
.card{background:var(--bg-card); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
.card-title{font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.card-title .emoji{font-size:18px}
.section-title{font-size:13px; font-weight:600; color:var(--text-2); margin:16px 0 8px; display:flex; align-items:center; gap:6px}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border:none; border-radius:var(--r-sm); background:var(--primary);
  color:#5D4E37; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
  font-family:inherit;
}
.btn:hover{background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-hover)}
.btn-sm{padding:4px 10px; font-size:12px}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text-2)}
.btn-outline:hover{background:var(--primary-light); color:var(--text-main)}
.btn-danger{background:var(--red-bg); color:var(--red)}
.btn-danger:hover{background:var(--red); color:#fff}
.btn-success{background:var(--green-bg); color:var(--green)}
.btn-success:hover{background:var(--green); color:#fff}
.btn-full{width:100%; justify-content:center}
input[type=text],input[type=number],textarea,select{
  width:100%; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--r-sm);
  font-size:14px; font-family:inherit; background:var(--bg-soft); color:var(--text-main);
  transition:border-color .2s;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--primary)}
textarea{resize:vertical; min-height:60px}
label{font-size:13px; color:var(--text-2); font-weight:600; margin-bottom:4px; display:block}
.form-group{margin-bottom:12px}
.tag{
  display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600;
}
.tag-yellow{background:var(--primary-light); color:var(--primary-dark)}
.tag-green{background:var(--green-bg); color:var(--green)}
.tag-orange{background:var(--orange-bg); color:var(--orange)}
.tag-red{background:var(--red-bg); color:var(--red)}
.tag-blue{background:var(--blue-bg); color:var(--blue)}
.tag-purple{background:var(--purple-bg); color:var(--purple)}
.tag-gray{background:#F5F5F5; color:#999}

/* ===== DAILY PLAN ===== */
.daily-top{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.daily-stats{
  flex:1; min-width:200px; background:var(--bg-card); border-radius:var(--r);
  padding:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:16px;
}
.ring-wrap{position:relative; width:80px; height:80px; flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.ring-center .pct{font-size:20px; font-weight:700; color:var(--text-main)}
.ring-center .sub{font-size:10px; color:var(--text-2)}
.daily-stats .info .t{font-size:14px; font-weight:600; margin-bottom:4px}
.daily-stats .info .d{font-size:12px; color:var(--text-2)}
.pomodoro-box{
  flex:1; min-width:200px; background:var(--bg-card); border-radius:var(--r);
  padding:16px; box-shadow:var(--shadow); text-align:center;
}
.pomodoro-ring{position:relative; width:130px; height:130px; margin:0 auto 8px}
.pomodoro-ring svg{transform:rotate(-90deg)}
.pomodoro-center{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.pomodoro-center .time{font-size:26px; font-weight:700; color:var(--text-main); font-variant-numeric:tabular-nums}
.pomodoro-center .hint{font-size:11px; color:var(--text-2); margin-top:2px}
.pomodoro-btns{display:flex; gap:8px; justify-content:center}
.pomodoro-count{font-size:12px; color:var(--text-2); margin-top:6px}

.task-list{margin-bottom:12px}
.task-item{
  display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
  background:var(--bg-card); border-radius:var(--r-sm); box-shadow:var(--shadow);
  border-left:3px solid transparent; transition:all .2s;
}
.task-item.done{border-left-color:var(--green); opacity:.7}
.task-item.undone{border-left-color:var(--red)}
.task-item.undone .task-text{font-weight:600}
.task-check{
  width:22px; height:22px; border:2px solid var(--border); border-radius:6px;
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  transition:all .2s; background:var(--bg-soft);
}
.task-check.checked{background:var(--green); border-color:var(--green); color:#fff}
.task-check.checked::after{content:'✓'; font-size:14px; font-weight:700}
.task-text{flex:1; font-size:14px; cursor:pointer}
.task-item.done .task-text{text-decoration:line-through; color:var(--text-2)}
.task-cat{font-size:11px; padding:2px 8px; border-radius:8px; background:var(--primary-light); color:var(--primary-dark); flex-shrink:0}
.task-del{font-size:16px; color:var(--text-3); cursor:pointer; flex-shrink:0; width:24px; text-align:center; border:none; background:none}
.task-del:hover{color:var(--red)}
.task-warning{
  background:var(--red-bg); border-radius:var(--r-sm); padding:8px 14px; font-size:13px;
  color:var(--red); text-align:center; margin-bottom:12px; font-weight:600;
}

/* ===== STUDY SYNC ===== */
.subject-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.subject-tab{
  padding:6px 14px; border-radius:16px; background:var(--bg-card); border:1.5px solid var(--border);
  font-size:13px; cursor:pointer; transition:all .2s; color:var(--text-2); white-space:nowrap;
}
.subject-tab.active{background:var(--primary); border-color:var(--primary); color:var(--text-main); font-weight:600}
.subject-tab:hover{border-color:var(--primary)}
.chapter-group{margin-bottom:16px}
.chapter-name{font-size:14px; font-weight:700; color:var(--text-main); margin-bottom:8px; padding-left:4px; border-left:3px solid var(--primary); padding-left:10px}
.unit-item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 14px; margin-bottom:6px;
  background:var(--bg-card); border-radius:var(--r-sm); box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.unit-name{flex:1; font-size:14px; min-width:120px}
.unit-status{display:flex; gap:4px; flex-wrap:wrap}
.status-btn{
  padding:2px 8px; border-radius:8px; font-size:11px; cursor:pointer;
  border:1.5px solid transparent; background:var(--bg-soft); color:var(--text-2);
  transition:all .15s;
}
.status-btn.active.unlearned{background:#F5F5F5; color:#999; font-weight:600}
.status-btn.active.learning{background:var(--primary-light); color:var(--primary-dark); font-weight:600}
.status-btn.active.mastered{background:var(--green-bg); color:var(--green); font-weight:600}
.status-btn.active.weak{background:var(--red-bg); color:var(--red); font-weight:600}
.unit-notes{
  width:100%; margin-top:6px; font-size:12px; padding:6px 10px;
  border:1px dashed var(--border); border-radius:8px; background:var(--bg-soft);
  min-height:32px;
}

/* ===== ERROR BOOK ===== */
.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.filter-bar select{width:auto; min-width:100px}
.error-card{
  background:var(--bg-card); border-radius:var(--r); padding:14px; box-shadow:var(--shadow);
  margin-bottom:10px; border-left:3px solid var(--red);
}
.error-card .ec-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.error-card .ec-subject{font-size:12px; font-weight:700}
.error-card .ec-tag{font-size:11px}
.error-card .ec-field{margin-bottom:6px}
.error-card .ec-field .lbl{font-size:11px; color:var(--text-2); font-weight:600}
.error-card .ec-field .val{font-size:13px}
.error-card .ec-photo{max-width:200px; max-height:200px; border-radius:8px; margin-top:6px; cursor:pointer}
.error-card .ec-actions{display:flex; gap:8px; margin-top:8px}
.redo-badge{
  display:inline-block; padding:2px 8px; background:var(--orange-bg); color:var(--orange);
  border-radius:8px; font-size:11px; font-weight:600; margin-left:auto;
}
.photo-preview{max-width:200px; max-height:200px; border-radius:8px; margin-top:6px}
.photo-btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px;
  background:var(--bg-soft); border:1.5px dashed var(--border); border-radius:var(--r-sm);
  cursor:pointer; font-size:13px; color:var(--text-2); transition:all .2s;
}
.photo-btn:hover{border-color:var(--primary); color:var(--text-main)}

/* ===== MEMORIZE ===== */
.memorize-section{margin-bottom:16px}
.memorize-section-title{font-size:14px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px}
.memorize-card{
  background:var(--bg-card); border-radius:var(--r-sm); padding:12px 14px; margin-bottom:8px;
  box-shadow:var(--shadow); display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;
}
.memorize-card.due{border-left:3px solid var(--orange)}
.memorize-card.upcoming{border-left:3px solid var(--blue)}
.memorize-card.completed{border-left:3px solid var(--green); opacity:.7}
.memorize-card .mc-content{flex:1; min-width:120px; font-size:13px}
.memorize-card .mc-category{font-size:11px}
.memorize-card .mc-progress{display:flex; gap:4px; align-items:center}
.mc-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:9px}
.mc-dot.done{background:var(--green); border-color:var(--green); color:#fff}
.mc-dot.current{border-color:var(--orange); background:var(--orange-bg); color:var(--orange); font-weight:700}
.mc-dot.future{background:var(--bg-soft); color:var(--text-3)}

/* ===== READING ===== */
.book-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:14px}
.book-card{background:var(--bg-card); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.book-card .bc-title{font-size:15px; font-weight:700; margin-bottom:4px}
.book-card .bc-author{font-size:12px; color:var(--text-2); margin-bottom:8px}
.book-card .bc-progress{margin-bottom:8px}
.book-card .bc-progress .bp-bar{width:100%; height:6px; background:var(--primary-light); border-radius:3px; overflow:hidden}
.book-card .bc-progress .bp-fill{height:100%; background:var(--primary); border-radius:3px; transition:width .3s}
.book-card .bc-progress .bp-text{font-size:11px; color:var(--text-2); margin-top:2px}
.book-card .bc-stats{display:flex; gap:12px; font-size:11px; color:var(--text-2); margin-bottom:8px}
.book-card .bc-actions{display:flex; gap:6px; flex-wrap:wrap}
.excerpt-item{background:var(--bg-soft); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:13px}
.excerpt-item .ei-type{font-size:10px; font-weight:600}
.excerpt-item .ei-text{margin-top:2px}
.excerpt-item .ei-date{font-size:10px; color:var(--text-3); margin-top:2px}

/* ===== WEEKLY REVIEW ===== */
.weekly-form{margin-bottom:16px}
.weekly-past{margin-bottom:16px}
.weekly-past-item{background:var(--bg-soft); border-radius:var(--r-sm); padding:12px; margin-bottom:8px}
.weekly-past-item .wp-week{font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:4px}
.weekly-past-item .wp-field{font-size:13px; margin-bottom:2px}
.weekly-past-item .wp-field .l{font-weight:600; color:var(--text-main)}
.reward-section{margin-top:16px}
.reward-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:10px}
.reward-card{
  background:var(--bg-card); border-radius:var(--r-sm); padding:12px; box-shadow:var(--shadow);
  text-align:center; position:relative;
}
.reward-card .rc-name{font-size:14px; font-weight:600; margin-bottom:4px}
.reward-card .rc-cost{font-size:18px; font-weight:700; color:var(--primary-dark)}
.reward-card .rc-cost .star{font-size:14px}
.reward-card .rc-btn{margin-top:6px}
.reward-card.disabled{opacity:.5}

.chart-box{background:var(--bg-card); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
.chart-title{font-size:14px; font-weight:700; margin-bottom:12px}
.bar-chart{display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:10px}
.bar-chart .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end}
.bar-chart .bar{width:60%; max-width:30px; background:linear-gradient(180deg,var(--primary),var(--primary-dark)); border-radius:4px 4px 0 0; transition:height .4s; min-height:2px; position:relative}
.bar-chart .bar .bar-val{position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:600; color:var(--text-2); white-space:nowrap}
.bar-chart .bar-label{font-size:10px; color:var(--text-2); margin-top:4px; text-align:center}
.h-bar-chart{display:flex; flex-direction:column; gap:6px}
.h-bar-row{display:flex; align-items:center; gap:8px}
.h-bar-row .h-label{width:60px; font-size:12px; text-align:right; color:var(--text-2); flex-shrink:0}
.h-bar-row .h-bar{flex:1; height:18px; background:var(--primary-light); border-radius:9px; overflow:hidden; position:relative}
.h-bar-row .h-bar .h-fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-dark)); border-radius:9px; transition:width .4s}
.h-bar-row .h-val{font-size:11px; color:var(--text-2); width:28px; flex-shrink:0}

/* ===== SLIDE PANEL ===== */
.slide-overlay{position:fixed; inset:0; background:rgba(0,0,0,.2); z-index:999; opacity:0; pointer-events:none; transition:opacity .3s}
.slide-overlay.open{opacity:1; pointer-events:auto}
.slide-panel{
  position:fixed; top:0; right:-450px; width:420px; max-width:100%; height:100%;
  background:var(--bg-card); z-index:1000; transition:right .3s ease; overflow-y:auto;
  box-shadow:-4px 0 20px rgba(0,0,0,.1);
}
.slide-panel.open{right:0}
.slide-header{
  position:sticky; top:0; background:var(--bg-card); padding:14px 18px;
  border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  z-index:10;
}
.slide-header h3{font-size:16px; font-weight:700}
.slide-close{font-size:20px; color:var(--text-2); cursor:pointer; border:none; background:none; padding:4px 8px}
.slide-body{padding:18px}

/* ===== TOAST ===== */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--text-main); color:#fff; padding:10px 22px; border-radius:20px;
  font-size:13px; z-index:2000; opacity:0; transition:all .3s; pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1}

/* ===== STAR PERSON ===== */
.star-person{display:inline-block; vertical-align:middle}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center; padding:30px 20px; color:var(--text-3)}
.empty-state .emoji{font-size:40px; margin-bottom:8px}
.empty-state .text{font-size:13px}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  :root{--sidebar-w:60px}
  .nav-item .nav-text{display:none}
  .nav-item{justify-content:center; padding:10px 8px}
  .sidebar-logo .logo-text{display:none}
  .sidebar-logo img{width:36px; height:auto}
  .nav-item .nav-icon img{width:24px; height:24px}
  .topbar{padding:8px 12px}
  .topbar-greeting{display:none}
  .topbar-date{font-size:13px}
  .topbar-date .weekday{display:none}
  .progress-bar{width:60px}
  .topbar-progress .label{display:none}
  .content{padding:12px}
  .card{padding:14px}

/* ========== UTILS ========== */
function pad(n){return n<10?'0'+n:''+n}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return fmtDate(new Date())}
function cnDate(d){
  const w=['日','一','二','三','四','五','六'];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+w[d.getDay()];
}
function getMonday(d){
  const r=new Date(d); const day=r.getDay()||7;
  r.setDate(r.getDate()-day+1); r.setHours(0,0,0,0);
  return r;
}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function uid(){return 'id_'+Date.now()+'_'+Math.floor(Math.random()*10000)}

function getStreak(){
  const records=Store.get('dailyRecords',{});
  let s=0; let d=new Date();
  while(true){
    const ds=fmtDate(d);
    const r=records[ds];
    if(r&&r.tasks&&r.tasks.some(t=>t.done)){ s++; d.setDate(d.getDate()-1); }
    else break;
  }
  return s;
}

function getWeeklyProgress(){
  const mon=getMonday(new Date());
  const records=Store.get('dailyRecords',{});
  let done=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(d.getDate()+i);
    const ds=fmtDate(d);
    const r=records[ds];
    if(r&&r.tasks&&r.tasks.some(t=>t.done)) done++;
  }
  return {done,total:7};
}

function recalcPoints(){
  let pts=0;
  const records=Store.get('dailyRecords',{});
  const sortedDates=Object.keys(records).sort();
  let streak=0;
  for(const date of sortedDates){
    const r=records[date];
    if(!r||!r.tasks) continue;
    const done=r.tasks.filter(t=>t.done).length;
    const total=r.tasks.length;
    pts+=done*2;
    if(done===total&&total>0){ pts+=5; streak++; if(streak>=7)pts+=10; else if(streak>=3)pts+=5; }
    else if(done>0) streak++;
    else streak=0;
    if(r.pomodoroCount) pts+=r.pomodoroCount*3;
  }
  const memTasks=Store.get('memorizeTasks',[]);
  memTasks.forEach(t=>{
    if(t.reviews) Object.values(t.reviews).forEach(d=>{if(d)pts+=5;});
  });
  const reading=Store.get('readingRecords',{});
  Object.values(reading).forEach(b=>{
    if(b.excerpts) pts+=b.excerpts.length*3;
    if(b.totalMinutes) pts+=Math.floor(b.totalMinutes/30);
  });
  const reviews=Store.get('weeklyReviews',[]);
  pts+=reviews.length*10;
  const log=Store.get('rewardLog',[]);
  log.forEach(r=>pts-=r.cost);
  pts=Math.max(0,pts);
  Store.set('points',pts);
  return pts;

function starChar(size, pose){
  const s=size||32;
  const img=CHAR_IMAGES[pose]||CHAR_IMAGES['run'];
  return `<img src="${img}" style="width:${s}px;height:${s}px;object-fit:contain"/>`;
}

/* ========== NAV ========== */
const NAV_ITEMS=[
  {id:'daily', icon:'run', text:'今日计划'},
  {id:'study', icon:'book', text:'课内同步'},
  {id:'wrong', icon:'frustrated', text:'错题本'},
  {id:'memorize', icon:'tired', text:'背诵任务'},
  {id:'reading', icon:'flowers', text:'阅读积累'},
  {id:'weekly', icon:'thumbsup', text:'每周复盘'},
];
let currentModule='daily';

function renderNav(){
  document.getElementById('navItems').innerHTML=
    NAV_ITEMS.map(n=>`<div class="nav-item ${n.id===currentModule?'active':''}" data-module="${n.id}" onclick="switchModule('${n.id}')">
      <span class="nav-icon">${starChar(26,n.icon)}</span><span class="nav-text">${n.text}</span>
    </div>`).join('');
}

function switchModule(id){
  currentModule=id;
  document.querySelectorAll('.module-view').forEach(el=>el.style.display='none');
  const target=document.getElementById('module-'+id);
  if(target){ target.style.display='block'; }
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelector('.nav-item[data-module="'+id+'"]')?.classList.add('active');
  const renderers={daily:renderDaily,study:renderStudy,wrong:renderWrong,memorize:renderMemorize,reading:renderReading,weekly:renderWeekly};
  if(renderers[id]) renderers[id]();
}

/* ========== TOP BAR ========== */
function renderTopBar(){
  const now=new Date();
  const w=['日','一','二','三','四','五','六'];
  document.getElementById('topbarDate').innerHTML=

/* ========== DAILY PLAN ========== */
let pomodoro={running:false, remaining:25*60, duration:25*60, interval:null};

function renderDaily(){
  const today=todayStr();
  const records=Store.get('dailyRecords',{});
  if(!records[today]){
    const template=Store.get('dailyTemplate',DEFAULT_TEMPLATE);
    records[today]={tasks:template.map(t=>({...t,done:false,id:uid()})), pomodoroCount:0};
    Store.set('dailyRecords',records);
  }
  const rec=records[today];
  const tasks=rec.tasks;
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const rate=total>0?Math.round(done/total*100):0;
  const undone=total-done;

  const circumference=2*Math.PI*32;
  const offset=circumference*(1-rate/100);

  let html=`
  <div class="daily-top">
    <div class="daily-stats">
      <div class="ring-wrap">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="32" fill="none" stroke="#FFF3CC" stroke-width="8"/>
          <circle cx="40" cy="40" r="32" fill="none" stroke="#FFD93D" stroke-width="8"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
        </svg>
        <div class="ring-center"><span class="pct">${rate}%</span><span class="sub">${done}/${total}</span></div>
      </div>
      <div class="info">
        <div class="t">今日学习计划</div>
        <div class="d">${done}项完成 · ${undone}项待完成</div>
        ${undone===0&&total>0?'<div class="d" style="color:var(--green);font-weight:600">全部完成，太棒啦！🌟</div>':''}
      </div>
    </div>
    <div class="pomodoro-box">
      <div class="pomodoro-ring">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="56" fill="none" stroke="#FFF3CC" stroke-width="8"/>
          <circle id="pomoRing" cx="65" cy="65" r="56" fill="none" stroke="#FFD93D" stroke-width="8"
            stroke-dasharray="${2*Math.PI*56}" stroke-dashoffset="${2*Math.PI*56*(1-pomodoro.remaining/pomodoro.duration)}" stroke-linecap="round"/>
        </svg>
        <div class="pomodoro-center">
          <span class="time" id="pomoTime">${pad(Math.floor(pomodoro.remaining/60))}:${pad(pomodoro.remaining%60)}</span>
          <span class="hint" id="pomoHint">${pomodoro.running?'专注中…':'点击开始专注'}</span>
        </div>
      </div>
      <div class="pomodoro-btns">
        <button class="btn btn-sm" id="pomoStartBtn" onclick="${pomodoro.running?'pausePomodoro()':'startPomodoro()'}">${pomodoro.running?'⏸ 暂停':'▶ 开始'}</button>
        <button class="btn btn-sm btn-outline" onclick="resetPomodoro()">↺ 重置</button>
      </div>
      <div class="pomodoro-count">今日完成 ${rec.pomodoroCount||0} 个番茄钟 🍅</div>
    </div>
  </div>
  `;

  if(undone>0&&done>0){
    html+=`<div class="task-warning">⏰ 还有 ${undone} 项任务未完成，加油千千！</div>`;
  }

  html+='<div class="task-list">';
  tasks.forEach(t=>{
    html+=`
    <div class="task-item ${t.done?'done':'undone'}">
      <div class="task-check ${t.done?'checked':''}" onclick="toggleTask('${t.id}')"></div>
      <span class="task-text" onclick="toggleTask('${t.id}')">${t.text}</span>
      <span class="task-cat">${t.cat}</span>
      <button class="task-del" onclick="deleteTask('${t.id}')">✕</button>
    </div>`;
  });
  html+='</div>';
  html+=`<div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" onclick="openAddTaskPanel()">＋ 添加任务</button>
    <button class="btn btn-outline" onclick="openTemplatePanel()">编辑模板</button>
  </div>`;

  document.getElementById('module-daily').innerHTML=html;
}

function toggleTask(id){
  const today=todayStr();
  const records=Store.get('dailyRecords',{});
  const rec=records[today]; if(!rec) return;
  const task=rec.tasks.find(t=>t.id===id); if(!task) return;
  task.done=!task.done;
  Store.set('dailyRecords',records);
  renderDaily(); renderTopBar();
  if(task.done) toast('✓ 打卡成功！');
}

function deleteTask(id){
  const today=todayStr();
  const records=Store.get('dailyRecords',{});
  const rec=records[today]; if(!rec) return;
  rec.tasks=rec.tasks.filter(t=>t.id!==id);
  Store.set('dailyRecords',records);
  renderDaily(); renderTopBar();
}

function delTpl(i){

function saveTemplate(){
  const texts=document.querySelectorAll('.tpl-text');
  const cats=document.querySelectorAll('.tpl-cat');
  const tpl=[];
  for(let i=0;i<texts.length;i++){
    const text=texts[i].value.trim();
    if(text) tpl.push({text, cat:cats[i].value.trim()||'其他'});
  }
  if(tpl.length===0){toast('至少保留一个模板任务');return;}
  Store.set('dailyTemplate',tpl);
  closeSlide(); toast('模板已保存！');
}

/* POMODORO */
function startPomodoro(){
  if(pomodoro.running) return;
  pomodoro.running=true;
  pomodoro.interval=setInterval(()=>{
    pomodoro.remaining--;
    if(pomodoro.remaining<=0){
      clearInterval(pomodoro.interval);
      pomodoro.running=false;
      pomodoro.remaining=pomodoro.duration;
      const today=todayStr();
      const records=Store.get('dailyRecords',{});
      if(records[today]){ records[today].pomodoroCount=(records[today].pomodoroCount||0)+1; Store.set('dailyRecords',records); }
      renderDaily(); renderTopBar();
      toast('🍅 专注完成！休息5分钟吧～');
      return;
    }
    updatePomodoroDisplay();
  },1000);
  updatePomodoroDisplay();
  renderDaily();
}
function pausePomodoro(){
  pomodoro.running=false;
  clearInterval(pomodoro.interval);
  renderDaily();
}
function resetPomodoro(){
  pomodoro.running=false;
  clearInterval(pomodoro.interval);
  pomodoro.remaining=pomodoro.duration;
  renderDaily();
}
function updatePomodoroDisplay(){
  const el=document.getElementById('pomoTime');
  if(el) el.textContent=pad(Math.floor(pomodoro.remaining/60))+':'+pad(pomodoro.remaining%60);
  const ring=document.getElementById('pomoRing');
  if(ring){
    const circ=2*Math.PI*56;
    ring.setAttribute('stroke-dashoffset',circ*(1-pomodoro.remaining/pomodoro.duration));
  }
  const hint=document.getElementById('pomoHint');
  if(hint) hint.textContent=pomodoro.running?'专注中…':'点击开始专注';
}

function handlePhotoCapture(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width, h=img.height;
      const maxW=600;
      if(w>maxW){h=h*maxW/w; w=maxW;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      tempPhoto=canvas.toDataURL('image/jpeg',0.6);
      const pv=document.getElementById('photoPreview');
      if(pv){pv.src=tempPhoto; pv.style.display='block';}
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function renderMemorize(){
  const tasks=Store.get('memorizeTasks',[]);
  const now=new Date();
  const intervals=[1,3,7,15];

  let due=[], upcoming=[], completed=[], notStarted=[];
  let startedContents=tasks.map(t=>t.content);

  MEMORIZE_LIBRARY.forEach((lib,idx)=>{
    if(startedContents.includes(lib.content)) return;
    notStarted.push({idx, ...lib});
  });

  tasks.forEach(t=>{
    const start=new Date(t.startDate);
    let allDone=true;
    let nextInterval=null;
    for(const iv of intervals){
      const reviewDate=new Date(start);
      reviewDate.setDate(reviewDate.getDate()+iv);
      const done=t.reviews&&t.reviews[iv];
      if(!done){
        allDone=false;
        if(nextInterval===null) nextInterval=iv;
      }
    }
    if(allDone){completed.push(t);}
    else if(nextInterval!==null){
      const reviewDate=new Date(start);
      reviewDate.setDate(reviewDate.getDate()+nextInterval);
      const diff=dayDiff(todayStr(),fmtDate(reviewDate));
      if(diff<=0) due.push({...t, nextInterval});
      else upcoming.push({...t, nextInterval, daysUntil:diff});
    }
  });

  let html='';
  if(due.length>0){
    html+=`<div class="memorize-section"><div class="memorize-section-title">⏰ 今日待复习 (${due.length})</div>`;
    due.forEach(t=>{
      html+=renderMemorizeCard(t);
    });
    html+='</div>';
  }
  if(upcoming.length>0){
    html+=`<div class="memorize-section"><div class="memorize-section-title">📅 即将复习</div>`;
    upcoming.sort((a,b)=>a.daysUntil-b.daysUntil);
    upcoming.forEach(t=>{
      html+=renderMemorizeCard(t);
    });
    html+='</div>';
  }
  if(notStarted.length>0){
    html+=`<div class="memorize-section"><div class="memorize-section-title">📚 未开始 (${notStarted.length})</div>`;
    notStarted.forEach(lib=>{
      html+=`<div class="memorize-card">
        <div class="mc-content">${esc(lib.content).replace(/\n/g,'<br>')}</div>
        <span class="mc-category tag tag-yellow">${lib.cat}</span>
        <button class="btn btn-sm" onclick="startMemorizeByIdx(${lib.idx})">开始</button>
      </div>`;
    });
    html+='</div>';
  }
  if(completed.length>0){
    html+=`<div class="memorize-section"><div class="memorize-section-title">✅ 已掌握 (${completed.length})</div>`;
    completed.forEach(t=>{
      html+=`<div class="memorize-card completed">
        <div class="mc-content">${esc(t.content).replace(/\n/g,'<br>')}</div>
        <span class="mc-category tag tag-green">${t.cat} · 已掌握</span>
      </div>`;
    });
    html+='</div>';
  }
  html+=`<button class="btn btn-outline" onclick="openAddMemorizePanel()">＋ 自定义背诵内容</button>`;

  document.getElementById('module-memorize').innerHTML=html;
}
function renderMemorizeCard(t){
  const intervals=[1,3,7,15];
  const start=new Date(t.startDate);
  let dots='';
  let nextIdx=0;
  for(let i=0;i<intervals.length;i++){
    const done=t.reviews&&t.reviews[intervals[i]];
    if(done) dots+='<span class="mc-dot done">✓</span>';
    else if(intervals[i]===t.nextInterval) {dots+='<span class="mc-dot current">'+intervals[i]+'</span>'; nextIdx=i;}
    else dots+='<span class="mc-dot future">'+intervals[i]+'</span>';
  }
  let badge='';
  if(t.daysUntil) badge=`<span class="tag tag-blue">${t.daysUntil}天后</span>`;
  else if(t.nextInterval) badge='<span class="tag tag-orange">今日复习</span>';
  return `<div class="memorize-card ${t.daysUntil?'upcoming':'due'}">
    <div class="mc-content">${esc(t.content).replace(/\n/g,'<br>')}</div>
    <span class="mc-category tag tag-yellow">${t.cat}</span>
    ${badge}
    <div class="mc-progress">${dots}</div>
    ${!t.daysUntil?`<button class="btn btn-sm btn-success" onclick="completeReview('${t.id}',${t.nextInterval})">完成复习</button>`:''}
  </div>`;
}
function startMemorize(cat,content){
  const tasks=Store.get('memorizeTasks',[]);
  tasks.push({id:uid(), content, cat, startDate:todayStr(), reviews:{}});
  Store.set('memorizeTasks',tasks);
  renderMemorize(); renderTopBar();
  toast('开始背诵！1天后首次复习');
}
function startMemorizeByIdx(idx){
  const lib=MEMORIZE_LIBRARY[idx];
  if(!lib) return;
  startMemorize(lib.cat, lib.content);
}
function completeReview(taskId,interval){
  const tasks=Store.get('memorizeTasks',[]);
  const t=tasks.find(x=>x.id===taskId); if(!t) return;
  if(!t.reviews) t.reviews={};
  t.reviews[interval]=true;
  Store.set('memorizeTasks',tasks);
  renderMemorize(); renderTopBar();
  toast('✓ 复习完成！');
}
function openAddMemorizePanel(){
  openSlide('自定义背诵内容',`
    <div class="form-group"><label>分类</label><input type="text" id="mCat" placeholder="如：语文古诗文"></div>
    <div class="form-group"><label>内容</label><textarea id="mContent" placeholder="输入要背诵的内容…" style="min-height:100px"></textarea></div>
    <button class="btn btn-full" onclick="addCustomMemorize()">添加</button>
  `);
}
function addCustomMemorize(){
  const cat=document.getElementById('mCat').value.trim()||'自定义';
  const content=document.getElementById('mContent').value.trim();
  if(!content){toast('请输入内容');return;}
  const tasks=Store.get('memorizeTasks',[]);
  tasks.push({id:uid(), content, cat, startDate:todayStr(), reviews:{}});
  Store.set('memorizeTasks',tasks);
  closeSlide(); renderMemorize(); renderTopBar();
  toast('已添加！');
}

/* ========== READING ========== */
function renderReading(){
  const records=Store.get('readingRecords',{});
  const books=READING_BOOKS;
  let html='<div class="book-grid">';
  books.forEach(b=>{
    const r=records[b.id]||{progress:0, excerpts:[], totalMinutes:0};
    const p=Math.round(r.progress||0);
    const excerptCount=(r.excerpts||[]).length;
    const timeMin=r.totalMinutes||0;
    html+=`
    <div class="book-card">
      <div class="bc-title">${b.title}</div>
      <div class="bc-author">${b.author} · ${b.genre}</div>
      <div style="font-size:12px;color:var(--text-2);margin-bottom:8px">${b.desc}</div>
      <div class="bc-progress">
        <div class="bp-bar"><div class="bp-fill" style="width:${p}%"></div></div>
        <div class="bp-text">阅读进度 ${p}%</div>
      </div>
      <div class="bc-stats">
        <span>📝 ${excerptCount}条摘抄</span>
        <span>⏱ ${timeMin}分钟</span>
      </div>
      <div class="bc-actions">
        <button class="btn btn-sm" onclick="openReadingPanel('${b.id}','progress')">更新进度</button>
        <button class="btn btn-sm btn-outline" onclick="openReadingPanel('${b.id}','excerpt')">添加摘抄</button>
        <button class="btn btn-sm btn-outline" onclick="openReadingPanel('${b.id}','time')">记录时长</button>
      </div>
    </div>`;
  });
  html+='</div>';

  html+='<div class="card"><div class="card-title"><span class="emoji">📖</span>我的摘抄与读后感</div>';
  let hasExcerpt=false;
  books.forEach(b=>{
    const r=records[b.id];
    if(r&&r.excerpts&&r.excerpts.length>0){
      hasExcerpt=true;
      html+=`<div style="font-size:13px;font-weight:700;margin:8px 0 4px;color:var(--primary-dark)">《${b.title}》</div>`;
      r.excerpts.slice().reverse().forEach(e=>{
        const typeTag=e.type==='word'?'好词':e.type==='sentence'?'好句':'读后感';
        const typeColor=e.type==='word'?'tag-yellow':e.type==='sentence'?'tag-blue':'tag-green';
        html+=`<div class="excerpt-item">
          <span class="ei-type tag ${typeColor}">${typeTag}</span>
          <div class="ei-text">${esc(e.content)}</div>
          <div class="ei-date">${e.date}</div>
        </div>`;
      });
    }
  });
  if(!hasExcerpt) html+='<div class="empty-state"><div class="text">还没有记录，去添加第一条摘抄吧～</div></div>';
  html+='</div>';

  document.getElementById('module-reading').innerHTML=html;
}
function openReadingPanel(bookId,type){
  const book=READING_BOOKS.find(b=>b.id===bookId);
  const records=Store.get('readingRecords',{});
  const r=records[bookId]||{progress:0, excerpts:[], totalMinutes:0};
  if(type==='progress'){
    openSlide(`更新进度 · ${book.title}`,`
      <div class="form-group"><label>阅读进度：${Math.round(r.progress||0)}%</label>
        <input type="range" id="rProgress" min="0" max="100" value="${r.progress||0}" style="width:100%" oninput="document.getElementById('rProgVal').textContent=this.value+'%'">
        <div id="rProgVal" style="font-size:18px;font-weight:700;color:var(--primary-dark);text-align:center">${Math.round(r.progress||0)}%</div>
      </div>
      <button class="btn btn-full" onclick="updateReadingProgress('${bookId}')">保存进度</button>
    `);
  } else if(type==='excerpt'){
    openSlide(`添加摘抄 · ${book.title}`,`
      <div class="form-group"><label>类型</label><select id="eType">
        <option value="word">好词</option><option value="sentence">好句</option><option value="note">读后感</option>
      </select></div>
      <div class="form-group"><label>内容</label><textarea id="eContent" placeholder="输入好词好句或读后感…" style="min-height:80px"></textarea></div>
      <button class="btn btn-full" onclick="addExcerpt('${bookId}')">添加</button>
    `);
  } else if(type==='time'){
    openSlide(`记录时长 · ${book.title}`,`
      <div class="form-group"><label>本次阅读时长（分钟）</label><input type="number" id="tMinutes" value="30" min="1"></div>
      <button class="btn btn-full" onclick="logReadingTime('${bookId}')">记录</button>
    `);
  }
}
function updateReadingProgress(bookId){
  const val=parseInt(document.getElementById('rProgress').value);
  const records=Store.get('readingRecords',{});
  if(!records[bookId]) records[bookId]={progress:0,excerpts:[],totalMinutes:0};
  records[bookId].progress=val;
  Store.set('readingRecords',records);
  closeSlide(); renderReading(); renderTopBar();
  toast('进度已更新！');
}
function addExcerpt(bookId){
  const content=document.getElementById('eContent').value.trim();
  if(!content){toast('请输入内容');return;}
  const type=document.getElementById('eType').value;
  const records=Store.get('readingRecords',{});
  if(!records[bookId]) records[bookId]={progress:0,excerpts:[],totalMinutes:0};
  records[bookId].excerpts.push({type, content, date:todayStr()});
  Store.set('readingRecords',records);
  closeSlide(); renderReading(); renderTopBar();
  toast('摘抄已添加！');
}
function logReadingTime(bookId){
  const min=parseInt(document.getElementById('tMinutes').value)||0;
  if(min<=0){toast('请输入有效时长');return;}
  const records=Store.get('readingRecords',{});
  if(!records[bookId]) records[bookId]={progress:0,excerpts:[],totalMinutes:0};
  records[bookId].totalMinutes=(records[bookId].totalMinutes||0)+min;
  Store.set('readingRecords',records);
  closeSlide(); renderReading(); renderTopBar();
  toast(`已记录 ${min} 分钟阅读时长！`);
}

/* ========== WEEKLY REVIEW ========== */
function renderWeekly(){
  const reviews=Store.get('weeklyReviews',[]);
  const mon=getMonday(new Date());
  const weekKey=fmtDate(mon);
  const existing=reviews.find(r=>r.week===weekKey);
  const points=recalcPoints();
  const streak=getStreak();

  let html=`
  <div class="card">
    <div class="card-title"><span class="emoji">📊</span>本周概览</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:700;color:var(--primary-dark)">${points}</div>
        <div style="font-size:12px;color:var(--text-2)">累计积分★</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:700;color:var(--orange)">${streak}</div>
        <div style="font-size:12px;color:var(--text-2)">连续打卡🔥</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:700;color:var(--green)">${getWeeklyProgress().done}</div>
        <div style="font-size:12px;color:var(--text-2)">本周打卡/7</div>
      </div>
    </div>
  </div>`;

  html+=`<div class="card">
    <div class="card-title"><span class="emoji">✍️</span>本周复盘 (${mon.getMonth()+1}月${mon.getDate()}日起)</div>
    <div class="weekly-form">
      <div class="form-group"><label>本周薄弱板块</label><textarea id="wWeak" placeholder="如：数学分式运算不熟练…" style="min-height:50px">${existing?esc(existing.weak):''}</textarea></div>
      <div class="form-group"><label>本周收获</label><textarea id="wGain" placeholder="如：掌握了全等三角形判定…" style="min-height:50px">${existing?esc(existing.gain):''}</textarea></div>
      <div class="form-group"><label>下周目标</label><textarea id="wGoal" placeholder="如：每天背10个英语单词…" style="min-height:50px">${existing?esc(existing.goal):''}</textarea></div>
      <button class="btn btn-full" onclick="saveWeeklyReview()">保存复盘</button>
    </div>
  </div>`;

  html+=renderCharts();

  html+='<div class="card"><div class="card-title"><span class="emoji">🎁</span>积分兑换奖励</div>';
  const rewards=Store.get('rewards',DEFAULT_REWARDS);
  html+='<div class="reward-grid">';
  rewards.forEach(r=>{
    const canAfford=points>=r.cost;
    html+=`<div class="reward-card ${canAfford?'':'disabled'}">
      <div class="rc-name">${r.name}</div>
      <div class="rc-cost"><span class="star">★</span>${r.cost}</div>
      <button class="btn btn-sm ${canAfford?'':'btn-outline'}" ${canAfford?`onclick="redeemReward('${r.id}')"`:'disabled'}>${canAfford?'兑换':'积分不足'}</button>
    </div>`;
  });
  html+='</div>';
  html+=`<button class="btn btn-outline btn-sm" onclick="openAddRewardPanel()" style="margin-top:8px">＋ 自定义奖励</button>`;
  const log=Store.get('rewardLog',[]);
  if(log.length>0){
    html+='<div style="margin-top:10px;font-size:12px;color:var(--text-2)">兑换记录：</div>';
    log.slice().reverse().slice(0,5).forEach(l=>{
      html+=`<div style="font-size:12px;color:var(--text-2);padding:2px 0">${l.date} · ${l.name} (-${l.cost}★)</div>`;
    });
  }
  html+='</div>';

  if(reviews.length>0){
    html+='<div class="card"><div class="card-title"><span class="emoji">📋</span>历史复盘</div>';
    reviews.slice().reverse().forEach(r=>{
      html+=`<div class="weekly-past-item">
        <div class="wp-week">${r.week}</div>
        ${r.weak?`<div class="wp-field"><span class="l">薄弱：</span>${esc(r.weak)}</div>`:''}
        ${r.gain?`<div class="wp-field"><span class="l">收获：</span>${esc(r.gain)}</div>`:''}
        ${r.goal?`<div class="wp-field"><span class="l">目标：</span>${esc(r.goal)}</div>`:''}
      </div>`;
    });
    html+='</div>';
  }

  document.getElementById('module-weekly').innerHTML=html;
}
function saveWeeklyReview(){
  const weak=document.getElementById('wWeak').value.trim();
  const gain=document.getElementById('wGain').value.trim();
  const goal=document.getElementById('wGoal').value.trim();
  const mon=getMonday(new Date());
  const weekKey=fmtDate(mon);
  const reviews=Store.get('weeklyReviews',[]);
  const idx=reviews.findIndex(r=>r.week===weekKey);
  const data={week:weekKey, weak, gain, goal};
  let wasNew=false;
  if(idx>=0) reviews[idx]=data;
  else { reviews.push(data); wasNew=true; }
  Store.set('weeklyReviews',reviews);
  renderWeekly(); renderTopBar();
  toast(wasNew?'复盘已保存 +10积分！':'复盘已更新！');
}
function renderCharts(){
  let html='<div class="card"><div class="card-title"><span class="emoji">📈</span>学习数据</div>';

  const mon=getMonday(new Date());
  const records=Store.get('dailyRecords',{});
  const w=['一','二','三','四','五','六','日'];
  let dailyRates=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(d.getDate()+i);
    const ds=fmtDate(d);
    const r=records[ds];
    if(r&&r.tasks&&r.tasks.length>0){
      const done=r.tasks.filter(t=>t.done).length;
      dailyRates.push({day:w[i], rate:Math.round(done/r.tasks.length*100)});
    } else {
      dailyRates.push({day:w[i], rate:0});
    }
  }
  html+='<div class="chart-box"><div class="chart-title">本周每日完成率</div><div class="bar-chart">';
  dailyRates.forEach(d=>{
    html+=`<div class="bar-col"><div class="bar" style="height:${d.rate}%"><span class="bar-val">${d.rate}%</span></div><div class="bar-label">${d.day}</div></div>`;
  });
  html+='</div></div>';

  const wq=Store.get('wrongQuestions',[]);
  const subjCount={};
  wq.forEach(q=>{subjCount[q.subject]=(subjCount[q.subject]||0)+1;});
  const sortedSubj=Object.entries(subjCount).sort((a,b)=>b[1]-a[1]);
  const maxCount=sortedSubj.length>0?sortedSubj[0][1]:1;
  if(sortedSubj.length>0){
    html+='<div class="chart-box"><div class="chart-title">错题科目分布</div><div class="h-bar-chart">';
    sortedSubj.forEach(([name,count])=>{
      html+=`<div class="h-bar-row"><div class="h-label">${name}</div><div class="h-bar"><div class="h-fill" style="width:${Math.round(count/maxCount*100)}%"></div></div><div class="h-val">${count}</div></div>`;
    });
    html+='</div></div>';
  }

  const reading=Store.get('readingRecords',{});
  const bookTimes=READING_BOOKS.map(b=>{
    const r=reading[b.id];
    return {name:b.title, min:r?(r.totalMinutes||0):0, excerpts:r?(r.excerpts||[]).length:0};
  });
  const maxTime=Math.max(1,...bookTimes.map(b=>b.min));
  html+='<div class="chart-box"><div class="chart-title">阅读时长统计（分钟）</div><div class="h-bar-chart">';
  bookTimes.forEach(b=>{
    html+=`<div class="h-bar-row"><div class="h-label" style="width:80px;font-size:10px">${b.name.slice(0,4)}</div><div class="h-bar"><div class="h-fill" style="width:${Math.round(b.min/maxTime*100)}%"></div></div><div class="h-val">${b.min}</div></div>`;
  });
  html+='</div></div>';

  html+='</div>';
  return html;
}
function redeemReward(rewardId){
  const rewards=Store.get('rewards',DEFAULT_REWARDS);
  const r=rewards.find(x=>x.id===rewardId); if(!r) return;
  const pts=recalcPoints();
  if(pts<r.cost){toast('积分不足');return;}
  const log=Store.get('rewardLog',[]);
  log.push({rewardId, name:r.name, cost:r.cost, date:todayStr()});
  Store.set('rewardLog',log);
  renderWeekly(); renderTopBar();
  toast('🎉 已兑换：'+r.name+'！');
}
function openAddRewardPanel(){
  openSlide('自定义奖励',`
    <div class="form-group"><label>奖励名称</label><input type="text" id="rName" placeholder="如：周末多看一部电影"></div>
    <div class="form-group"><label>所需积分</label><input type="number" id="rCost" value="50" min="1"></div>
    <button class="btn btn-full" onclick="addCustomReward()">添加</button>
  `);
}
function addCustomReward(){
  const name=document.getElementById('rName').value.trim();
  const cost=parseInt(document.getElementById('rCost').value)||0;
  if(!name){toast('请输入奖励名称');return;}
  if(cost<=0){toast('请输入有效积分');return;}
  const rewards=Store.get('rewards',DEFAULT_REWARDS);
  rewards.push({id:uid(), name, cost});
  Store.set('rewards',rewards);
  closeSlide(); renderWeekly();
  toast('奖励已添加！');
}

function exportAllData(){
  const keys=['dailyTemplate','dailyRecords','studyProgress','wrongQuestions','memorizeTasks','readingRecords','weeklyReviews','rewards','rewardLog','points'];
  const data={};
  keys.forEach(k=>data[k]=Store.get(k));
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='千千学习数据备份_'+todayStr()+'.json';
  a.click();
  toast('数据已导出！');
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

function openSlide(title,body){
  document.getElementById('slideTitle').textContent=title;
  document.getElementById('slideBody').innerHTML=body;
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('slideOverlay').classList.add('open');
}
function closeSlide(){
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('slideOverlay').classList.remove('open');
}

function init(){
  document.getElementById('sidebarLogo').innerHTML=starChar(44,'catch');
  renderNav();
  renderTopBar();
  switchModule('daily');
  setInterval(renderTopBar,60000);
}
init();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
